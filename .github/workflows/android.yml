name: Android app

# Builds the Capacitor shell in mobile/ (docs/mobile-app.md phase 4).
#   - Pull requests that touch mobile/ (or this file): unsigned debug APK, to prove it still builds.
#   - Tag app-vX.Y.Z: signed release AAB (for Play) + APK, version taken from the tag, then the APK
#     is published on the website's /app page (job "website"; repo variable APP_WEB_PUBLISH =
#     draft → upload as a Draft only, off → skip).
#   - Manual run: same as a pull request, or a signed release when "release" is ticked.
# Signing and Firebase config come only from repository secrets; the repo is public.
on:
  pull_request:   # any base branch, so stacked app PRs are checked too
    paths: ['mobile/**', '.github/workflows/android.yml']
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Signed release build (needs the signing secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.release) && 'Release (signed AAB + APK)' || 'Debug APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.release) && '1' || '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK (platform + build-tools 36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "SDK ready at $ANDROID_HOME"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: node tools/set-version.mjs "$GITHUB_REF_NAME"

      - name: Firebase config (push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" \
              || { echo "GOOGLE_SERVICES_JSON is not valid JSON"; exit 1; }
            echo "google-services.json written"
          elif [ -n "$RELEASE" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret not set: this release has no status-bar push. In-app notifications still work."
          else
            echo "No google-services.json (fine for a debug build; push won't work in it)"
          fi

      - name: Sync web config + plugins into the Android project
        run: npx cap sync android

      - name: Signing key
        if: env.RELEASE == '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release (AAB + APK)
        if: env.RELEASE == '1'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] \
            || { echo "::error::Signing secrets missing (ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)"; exit 1; }
          ./gradlew --no-daemon bundleRelease assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i 'SHA-256'

      - name: Build debug APK
        if: env.RELEASE != '1'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json

      - name: Summary
        run: |
          . android/app/version.properties
          {
            echo "### Android build: $versionName (code $versionCode)"
            ls -l android/app/build/outputs/*/*/*.a?? 2>/dev/null | awk '{print "- " $NF " (" int($5/1024) " KB)"}'
            if [ -n "$RELEASE" ]; then
              echo
              echo "Next (docs/mobile-app.md, Release workflow): upload the .aab to Play Console. A tag build also"
              echo "publishes the APK on the website /app page (job \"Publish on the website\")."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: maa-sarada-${{ env.RELEASE && 'release' || 'debug' }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  website:
    name: Publish on the website
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v') && vars.APP_WEB_PUBLISH != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}/app
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: maa-sarada-release-${{ github.run_number }}
          path: ${{ runner.temp }}/build

      - name: Version + notes from the tag
        id: v
        run: |
          NAME="${GITHUB_REF_NAME#app-v}"
          IFS=. read -r MA MI PA <<< "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))" >> "$GITHUB_OUTPUT"
          APK="$(find "$RUNNER_TEMP/build" -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::No APK in the build artifact"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          NOTES="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/-----BEGIN PGP/,$d')"
          printf '%s\n' "${NOTES:-Version $NAME}" > "$RUNNER_TEMP/notes.txt"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] \
            || { echo "DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF

      - name: Upload + publish
        env:
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
          APK: ${{ steps.v.outputs.apk }}
          DRAFT: ${{ vars.APP_WEB_PUBLISH == 'draft' && '--draft' || '' }}
          PHP_VERSION: ${{ vars.PHP_VERSION || '8.3' }}
        run: |
          IN="$DEPLOY_PATH/shared/app-incoming"
          ssh prod "mkdir -p '$IN'"
          scp -q "$APK" "prod:$IN/maa-sarada-$CODE.apk"
          scp -q "$RUNNER_TEMP/notes.txt" "prod:$IN/notes-$CODE.txt"
          ssh prod "PHP=/opt/alt/php${PHP_VERSION//./}/usr/bin/php; [ -x \"\$PHP\" ] || PHP=php; \
            cd '$DEPLOY_PATH/current' && \"\$PHP\" vayu app:release --apk='$IN/maa-sarada-$CODE.apk' \
              --name='$NAME' --code='$CODE' --notes-file='$IN/notes-$CODE.txt' $DRAFT; \
            rc=\$?; rm -f '$IN/notes-$CODE.txt' '$IN/maa-sarada-$CODE.apk'; exit \$rc"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website release ${{ job.status }}: ${{ steps.v.outputs.name }} (code ${{ steps.v.outputs.code }})"
            echo "- ${{ vars.APP_WEB_PUBLISH == 'draft' && 'Uploaded as a Draft: publish it in Admin > Settings > Android app' || 'Published' }} at ${{ vars.APP_URL }}/app"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/deploy_key

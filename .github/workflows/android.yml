name: Android app

# Builds the Capacitor shell in mobile/ (docs/mobile-app.md phase 4).
#   - Pull requests that touch mobile/ (or this file): unsigned debug APK, to prove it still builds.
#   - Tag app-vX.Y.Z: signed release AAB (for Play) + APK, version taken from the tag.
#   - Manual run: same as a pull request, or a signed release when "release" is ticked.
# Signing and Firebase config come only from repository secrets; the repo is public.
on:
  pull_request:   # any base branch, so stacked app PRs are checked too
    paths: ['mobile/**', '.github/workflows/android.yml']
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Signed release build (needs the signing secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.release) && 'Release (signed AAB + APK)' || 'Debug APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.release) && '1' || '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK (platform + build-tools 36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "SDK ready at $ANDROID_HOME"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: node tools/set-version.mjs "$GITHUB_REF_NAME"

      - name: Firebase config (push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" \
              || { echo "GOOGLE_SERVICES_JSON is not valid JSON"; exit 1; }
            echo "google-services.json written"
          elif [ -n "$RELEASE" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret missing: a release without it has no push notifications."; exit 1
          else
            echo "No google-services.json (fine for a debug build; push won't work in it)"
          fi

      - name: Sync web config + plugins into the Android project
        run: npx cap sync android

      - name: Signing key
        if: env.RELEASE == '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release (AAB + APK)
        if: env.RELEASE == '1'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] \
            || { echo "::error::Signing secrets missing (ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)"; exit 1; }
          ./gradlew --no-daemon bundleRelease assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i 'SHA-256'

      - name: Build debug APK
        if: env.RELEASE != '1'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json

      - name: Summary
        run: |
          . android/app/version.properties
          {
            echo "### Android build: $versionName (code $versionCode)"
            ls -l android/app/build/outputs/*/*/*.a?? 2>/dev/null | awk '{print "- " $NF " (" int($5/1024) " KB)"}'
            if [ -n "$RELEASE" ]; then
              echo
              echo "Next (docs/mobile-app.md, Release workflow): upload the .aab to Play Console, then upload Play's"
              echo "signed universal APK in Admin > Settings > Android app. The APK here is signed with the upload key."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: maa-sarada-${{ env.RELEASE && 'release' || 'debug' }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

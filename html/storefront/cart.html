<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bag — Maa Sarada</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/store.js"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
</head>
<body class="font-sans text-[15px]">
<main id="main" class="w-full max-w-[2000px] mx-auto px-4 sm:px-6 lg:px-10 2xl:px-16 pt-8">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div><p class="eyebrow">Your bag</p><h1 class="font-display text-[40px] sm:text-[48px] leading-tight tracking-tight mt-1">Review your stones</h1></div>
    <a href="shop.html" class="inline-flex items-center gap-1.5 text-[14px] font-semibold hover:text-teal"><i data-lucide="arrow-left"></i> Keep shopping</a>
  </div>

  <ol class="mt-6 flex items-center gap-2 text-[13px] text-ink-500" aria-label="Checkout steps">
    <li class="flex items-center gap-2 text-ink font-semibold"><span class="w-6 h-6 rounded-full bg-ink text-cream grid place-items-center text-[12px]">1</span>Bag</li><li class="w-8 h-px bg-ink/20"></li>
    <li class="flex items-center gap-2"><span class="w-6 h-6 rounded-full border border-ink/25 grid place-items-center text-[12px]">2</span>Details</li><li class="w-8 h-px bg-ink/20"></li>
    <li class="flex items-center gap-2"><span class="w-6 h-6 rounded-full border border-ink/25 grid place-items-center text-[12px]">3</span>Pay by UPI</li>
  </ol>

  <div id="wrap" class="mt-8 grid lg:grid-cols-[minmax(0,1fr),420px] gap-8 items-start"></div>

  <section id="recoWrap" class="mt-20">
    <div class="mb-6"><p class="eyebrow">Finish the job</p><h2 class="font-display text-[34px] leading-tight mt-1">Often bought together</h2></div>
    <div id="reco" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-3 sm:gap-5"></div>
  </section>
</main>

<script>
renderChrome({ active: 'bag' });
seedDemoBag();

function render() {
  const t = bag.totals(), items = t.items;
  if (!items.length) {
    $('#wrap').innerHTML = `<div class="lg:col-span-2 bg-white rounded-[28px] border border-ink/5 p-12 text-center"><span class="w-16 h-16 mx-auto rounded-full bg-cream grid place-items-center"><i data-lucide="shopping-bag" class="!w-7 !h-7"></i></span>
      <h2 class="font-display text-[30px] mt-5">Your bag is empty</h2><p class="text-ink-500 mt-1">Find a stone for your floor, wall or kitchen.</p>
      <div class="mt-6 flex justify-center gap-2"><a href="shop.html" class="btn btn-dark">Shop stone</a><a href="saved.html" class="btn btn-line">View saved</a></div></div>`;
    icons(); return;
  }
  const coverage = items.reduce((s, i) => s + (i.unit === 'box' ? i.qty * i.p.pricing.pack_qty : i.unit === 'sq ft' ? i.qty : 0), 0);
  $('#wrap').innerHTML = `
  <div class="space-y-3" data-map="bag lines → order_items snapshot (product_id, variant_id, sku, title, unit, price, qty)">
    ${items.map(i => { const step = i.unit === 'box' ? 1 : 10, cmp = compareOf(i.p, i.v);
      return `<article class="bg-white rounded-[24px] border border-ink/5 p-4 sm:p-5 grid grid-cols-[88px,1fr] sm:grid-cols-[120px,1fr,auto] gap-4 sm:gap-6 items-center">
        <a href="${productUrl(i.p)}${i.v ? '&v=' + i.v.id : ''}" class="row-span-2 sm:row-span-1 aspect-square rounded-2xl overflow-hidden"><img src="${i.p.img}" alt="" class="w-full h-full object-cover"></a>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-[.12em] text-ink-400">${brandOf(i.p).name}</p>
          <h2 class="font-display text-[22px] leading-tight"><a href="${productUrl(i.p)}" class="hover:text-teal">${esc(i.p.name)}</a></h2>
          ${i.v ? `<p class="mt-1 flex flex-wrap gap-1.5">${i.v.values.map(id => { const o = optionValue(id); return `<span class="text-[12px] bg-cream rounded-md px-2 py-0.5"><span class="text-ink-400">${o.group.name}:</span> <b>${o.value}</b></span>`; }).join('')}</p>` : ''}
          <p class="text-[12.5px] text-ink-400 mt-1.5">SKU ${i.v ? i.v.sku : i.p.sku} · ${inr(i.price)} / ${i.unit}${cmp ? ` <del class="text-ink-300">${inr(cmp)}</del>` : ''}${i.unit === 'box' ? ` · covers ${round2(i.qty * i.p.pricing.pack_qty)} sq ft` : ''}</p>
          ${i.p.stock === 'low' ? '<p class="text-[12.5px] text-copper mt-1 flex items-center gap-1"><i data-lucide="flame"></i> Few slabs left in this lot</p>' : ''}
        </div>
        <div class="col-start-2 sm:col-start-3 flex sm:flex-col items-center sm:items-end justify-between gap-3">
          <div class="flex items-center h-10 rounded-full border border-ink/15 bg-cream-50">
            <button class="w-10 h-10 grid place-items-center" data-dec="${i.key}" data-step="${step}" aria-label="Less"><i data-lucide="minus"></i></button>
            <input value="${i.qty}" data-qty="${i.key}" type="number" min="1" class="w-16 text-center bg-transparent font-semibold outline-none" aria-label="Quantity in ${i.unit}">
            <button class="w-10 h-10 grid place-items-center" data-inc="${i.key}" data-step="${step}" aria-label="More"><i data-lucide="plus"></i></button>
          </div>
          <span class="text-[11.5px] text-ink-400 -mt-1 hidden sm:block">${i.unit}</span>
          <p class="font-display text-[22px]">${inr(i.line)}</p>
          <div class="flex gap-3 text-[12.5px] font-semibold"><button class="text-ink-500 hover:text-teal" data-later="${i.key}">Save for later</button><button class="text-ink-500 hover:text-copper" data-rm="${i.key}">Remove</button></div>
        </div></article>`; }).join('')}
    <div class="bg-teal-50 rounded-2xl px-5 py-4 flex flex-wrap items-center gap-3 text-[14px]"><i data-lucide="ruler" class="text-teal"></i><span>Your bag covers about <b>${Math.round(coverage).toLocaleString('en-IN')} sq ft</b>. Not sure it’s enough?</span><a href="calculator.html" class="font-semibold text-teal ml-auto">Check with the calculator →</a></div>
  </div>

  <aside class="lg:sticky lg:top-[92px] bg-white rounded-[28px] border border-ink/5 p-6 sm:p-7" data-map="order totals: subtotal − discount + tax (single GST %) · delivery included">
    <h2 class="font-display text-[26px]">Order summary</h2>
    <dl class="mt-5 space-y-3 text-[14.5px]">
      <div class="flex justify-between"><dt class="text-ink-500">Subtotal (${items.length} items)</dt><dd class="font-semibold">${inr(t.subtotal, true)}</dd></div>
      ${t.savings ? `<div class="flex justify-between text-teal"><dt>You save vs. list price</dt><dd class="font-semibold">${inr(t.savings, true)}</dd></div>` : ''}
      <div class="flex justify-between"><dt class="text-ink-500">Delivery</dt><dd class="font-semibold text-teal">Included</dd></div>
      <div class="flex justify-between"><dt class="text-ink-500">GST ${BUSINESS.gst_percent}% <span class="text-[12px] text-ink-400">(CGST + SGST in West Bengal)</span></dt><dd class="font-semibold">${inr(t.tax, true)}</dd></div>
      <div class="flex justify-between pt-3 border-t border-ink/10 text-[17px]"><dt class="font-semibold">Total</dt><dd class="font-display text-[26px] leading-none">${inr(t.total, true)}</dd></div>
    </dl>
    <div class="mt-5 rounded-2xl bg-cream p-4 text-[13.5px]">
      <p class="font-semibold flex items-center gap-2"><i data-lucide="smartphone" class="text-teal"></i> Pay by UPI at checkout</p>
      <div class="mt-3 grid grid-cols-2 gap-2"><div class="bg-white rounded-xl p-3"><p class="text-ink-400 text-[12px]">${BUSINESS.advance_percent}% advance</p><p class="font-bold">${inr(t.advance, true)}</p></div><div class="bg-white rounded-xl p-3"><p class="text-ink-400 text-[12px]">Or pay in full</p><p class="font-bold">${inr(t.total, true)}</p></div></div>
    </div>
    <a href="checkout.html" class="btn btn-copper w-full mt-5">Continue to checkout <i data-lucide="arrow-right"></i></a>
    <p class="mt-3 text-[12px] text-ink-400 text-center">Your order is placed only after you submit your payment details.</p>
    <div class="mt-5 pt-5 border-t border-ink/10 grid grid-cols-3 text-center text-[11.5px] text-ink-500 gap-2"><span><i data-lucide="shield-check" class="mx-auto text-teal"></i>Checked by hand</span><span><i data-lucide="receipt-text" class="mx-auto text-teal"></i>GST invoice</span><span><i data-lucide="package-check" class="mx-auto text-teal"></i>Breakage replaced</span></div>
  </aside>`;
  const inBag = items.map(i => i.slug);
  $('#reco').innerHTML = live.filter(p => !inBag.includes(p.slug) && purchasable(p)).slice(0, 6).map(card).join('');
  icons();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-inc],[data-dec],[data-rm],[data-later]'); if (!b) return;
  const d = b.dataset, line = bag.lines().find(l => l.key === (d.inc || d.dec || d.rm || d.later));
  if (d.inc) bag.setQty(d.inc, line.qty + +d.step);
  if (d.dec) bag.setQty(d.dec, Math.max(1, line.qty - +d.step));
  if (d.rm) { bag.remove(d.rm); toast('Removed'); }
  if (d.later) { if (!saved.has(line.slug)) saved.toggle(line.slug); bag.remove(d.later); toast('Moved to saved'); }
  render();
});
document.addEventListener('change', e => { const k = e.target.dataset.qty; if (k) { bag.setQty(k, Math.max(1, +e.target.value || 1)); render(); } });
render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved — Maa Sarada</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/store.js"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
</head>
<body class="font-sans text-[15px]">
<main id="main" class="w-full max-w-[2000px] mx-auto px-4 sm:px-6 lg:px-10 2xl:px-16 pt-8">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div><p class="eyebrow">Saved</p><h1 class="font-display text-[40px] sm:text-[46px] leading-tight tracking-tight mt-1">Your shortlist</h1><p class="text-ink-500 text-[14px]">Saved on this device. <a href="signin.html" class="text-teal font-semibold">Sign in</a> to keep it across phones.</p></div>
    <a id="share" href="#" class="btn btn-line !h-11"><i data-lucide="share-2"></i> Share on WhatsApp</a>
  </div>
  <div id="grid" class="mt-8 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-3 sm:gap-5"></div>
  <section id="designs" class="mt-20">
    <div class="mb-6"><p class="eyebrow">Room designs</p><h2 class="font-display text-[34px] leading-tight mt-1">Saved from the visualiser</h2></div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">

    </div>
  </section>
</main>
<script>
renderChrome({ active: 'saved' });
if (!saved.all().length && !qs('empty')) ['statuario-white', 'udaipur-green', 'honey-onyx', 'black-galaxy-granite'].forEach(s => saved.toggle(s));
function render() {
  const list = saved.all().map(bySlug).filter(Boolean);
  $('#grid').innerHTML = list.length ? list.map(card).join('') : `<div class="col-span-full bg-white rounded-[28px] border border-ink/5 p-12 text-center"><span class="w-16 h-16 mx-auto rounded-full bg-cream grid place-items-center"><i data-lucide="heart" class="!w-7 !h-7"></i></span><h2 class="font-display text-[28px] mt-5">Nothing saved yet</h2><p class="text-ink-500 mt-1">Tap the heart on any stone to keep it here.</p><a href="shop.html" class="btn btn-dark mt-6">Browse stone</a></div>`;
  $('#share').href = 'https://wa.me/?text=' + encodeURIComponent('My stone shortlist: ' + list.map(p => p.name).join(', '));
  icons();
}
document.addEventListener('saved-changed', render);
$('#designs .grid').innerHTML = [['Living room · Statuario', U('1600607687939-ce8a6c25118c', 800), '12 Nov'], ['Kitchen · Black Galaxy', U('1565183928294-7063f23ce0f8', 800), '8 Nov'], ['Bathroom · Nero Marquina', U('1600566752355-35792bedcfea', 800), '2 Nov']]
  .map(([t, i, d]) => `<a href="visualizer.html" class="group bg-white rounded-[24px] border border-ink/5 overflow-hidden"><div class="aspect-[16/10] overflow-hidden"><img src="${i}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy"></div><div class="p-4 flex items-center justify-between"><div><b>${t}</b><p class="text-[12.5px] text-ink-400">Saved ${d}</p></div><i data-lucide="arrow-up-right"></i></div></a>`).join('');
render();
</script>
</body>
</html>

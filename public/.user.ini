; PHP limits for this site (read by PHP-FPM / LiteSpeed on Hostinger; cached ~5 min).
; Bulk upload sends the products sheet + images ZIP in one request, so post_max_size
; must cover both together. Keep in sync with `php vayu run` (core/Console/Commands/RunCommand.php).
upload_max_filesize = 64M
post_max_size = 80M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
